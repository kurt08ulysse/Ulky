name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Laravel / PHP
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_pgsql, mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env de test
        run: cp .env.ci .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Style — Pint
        run: vendor/bin/pint --test

      - name: Migrations (SQLite en mémoire)
        run: php artisan migrate --force

      - name: Seed rôles
        run: php artisan db:seed --class=RolesSeeder --force

      - name: Tests Feature
        run: php artisan test --stop-on-failure

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Expo / React Native / TypeScript
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulky_new

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ulky_new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — vérification
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings=0
